<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../style/style.css" />
    <link rel="stylesheet" href="../style/renderburgerstyle.css" />
    <link rel="stylesheet" href="../style/renderpizzastyle.css" />

    <link rel="stylesheet" href="../style/rendersaladstyle.css" />
    <link rel="stylesheet" href="../style/responsive-style.css" />
    <link rel="stylesheet" href="../style/yourbasket.css" />
    <link rel="stylesheet" href="../style/progressbar.csss" />

    <script src="../Raw-data/db.js" defer></script>
    <script src="../script/template/cardviewtemplate.js" defer></script>
    <script
      src="../script/containerbasket/cardviewbaskettemplate.js"
      defer
    ></script>
    <script src="../script/containerbasket/choiceUser.js" defer></script>
    <script src="../script/loadcardview.js" defer></script>
    <script src="../script/amountorder/burgercartegorie.js" defer></script>
    <script src="../script/amountorder/pizzacategorie.js" defer></script>
    <script src="../script/amountorder/saladcartegorie.js" defer></script>

    <title>BestellApp</title>
  </head>
  <header class="header-wrapper">
    <div class="header-logo">
      <a href="#"
        ><img
          class="img-bestellApp"
          src="../assets/icons/Logo 02.png"
          alt="BestellApp"
        />
      </a>
    </div>
    <div class="burger-menu-content">
      <a href="#"><img src="../assets/icons/menu.png" alt="menu.png" /></a>
    </div>
  </header>

  <body>
    <main class="Main-design-content">
      <section class="heroe-section-content">
        <div class="landing-section">
          <a href=""
            ><img
              class="img-pub"
              src="../assets/img/headline.png"
              alt="headline.png"
          /></a>
        </div>
        <div class="sublanding-section">
          <a href=""
            ><img class="burger-icon" src="../assets/img/Ellipse 16.png" alt=""
          /></a>
        </div>
        <div class="restaurant-wrapper">
          <div class="restaurant-wrapper-content">
            <div class="restaurant-name">
              <h1><span class="span-burger">Burger</span>House</h1>
            </div>
            <div class="restaurant-rating">
              <div class="rating-star">
                <a href="#"
                  ><img class="img-star" src="../assets/icons/star.png" alt=""
                /></a>
              </div>
              <div class="rating-quote">
                <h5><span class="span-quote">4.1</span>(317)</h5>
              </div>
            </div>
          </div>
          <div class="restaurant-description">
            <h4>
              The best of Burgers, Pizza, and Greens, all in one great place
            </h4>
          </div>
        </div>
      </section>
      <section class="menu-catalogue">
        <div class="burger-categorie">
          <div class="img-cat1">
            <img
              class="img-burger-categorie"
              src="../assets/icons/Chanese.png"
              alt=""
            />
          </div>
          <div class="burger">
            <h3>Burger & Sandwiches</h3>
          </div>
        </div>
        <div class="menu-basket-wrapper">
          <div id="menu-burger" class="burger-sandwiche"></div>
          <div class="basket-content">
            <div class="title-your-basket">
              <h3>Your Basket</h3>
            </div>
            <div class="empty-basket-text" id="empty-basket-text-display">
              <div class="text-empty">
                <h5>
                  Nothing here yet. Go ahead and choose something delicious!
                </h5>
              </div>
              <div class="empty-cat">
                <a href="#"
                  ><img
                    class="empty-basket"
                    src="../assets/icons/basket.png"
                    alt="basket.png"
                /></a>
              </div>
            </div>
            <div class="all-oder-into-basket">
              <div id="burger-basket"></div>
              <div id="meat-burger-basket"></div>
              <div id="red-burger-basket"></div>
              <div id="big-chicken-burger-basket"></div>

              <div id="margheritta-basket"></div>
              <div id="chorizo-basket"></div>
              <div id="funghi-basket"></div>
              <div id="quattro-basket"></div>
            </div>
          </div>
        </div>

        <div class="pizza-categorie">
          <div class="img-cat2">
            <img
              class="img-pizza-categorie"
              src="../assets/icons/Pizza1.png"
              alt=""
            />
          </div>
          <div class="pizza">
            <h3>Pizza (30cm)</h3>
          </div>
        </div>
        <div class="menu-pizza-wrapper">
          <div id="menu-pizza" class="pizza_30cm"></div>
          <div class="test"></div>
        </div>

        <div class="salad-categorie">
          <img
            class="img-salad-categorie"
            src="../assets/icons/Salad1.png"
            alt=""
          />
          <h3>Salad</h3>
        </div>
        <div id="menu-salad" class="salad"></div>
      </section>
    </main>
  </body>

  <footer class="footer-wrapper">
    <div class="footer-content">
      <div class="logo-copyright-name">
        <div class="logo-copyright">
          <a href="#"
            ><img src="../assets/icons/copyright.png" alt="copyright"
          /></a>
        </div>
        <div id="year-copyright">
          <h6>2026</h6>
        </div>
        <div class="name-copyright">
          <h6>BurgerHouse</h6>
        </div>
      </div>

      <div class="info-imprint">
        <h6>Imprint</h6>
      </div>

      <div class="cookie">
        <h6>Cookie Preferences</h6>
      </div>
    </div>
  </footer>
</html>
